worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    server_tokens off;

    limit_req_status 429;

    limit_req_zone $binary_remote_addr zone=api_global_per_ip:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=ai_chat_per_ip:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=auth_login_per_ip:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=auth_oauth_sync_per_ip:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=auth_refresh_per_ip:10m rate=30r/m;
    limit_req_zone $binary_remote_addr zone=auth_register_per_ip:10m rate=10r/m;

    upstream nodejs_cluster {
        least_conn;
        server app:3001;
        server app2:3002;
        server app3:3003;
    }

    server {
        listen 8080 default_server;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        ssl_certificate /ssl/cert.pem;
        ssl_certificate_key /ssl/key.pem;
        return 444;
    }

    server {
        listen 8080;
        server_name example.com;

        return 301 https://example.com$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name example.com;

        ssl_certificate /ssl/cert.pem;
        ssl_certificate_key /ssl/key.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;

        # Enable if appropriate for your certificate setup
        # ssl_stapling on;
        # ssl_stapling_verify on;
        # resolver 1.1.1.1 1.0.0.1 valid=300s ipv6=off;
        # resolver_timeout 5s;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        location = /api/v1/ai/chat {
            limit_req zone=ai_chat_per_ip burst=5 nodelay;
            proxy_pass http://nodejs_cluster;
        }

        location = /api/v1/auth/login {
            limit_req zone=auth_login_per_ip burst=5 nodelay;
            proxy_pass http://nodejs_cluster;
        }

        location = /api/v1/auth/oauth-sync {
            limit_req zone=auth_oauth_sync_per_ip burst=5 nodelay;
            proxy_pass http://nodejs_cluster;
        }

        location = /api/v1/auth/refresh {
            limit_req zone=auth_refresh_per_ip burst=10 nodelay;
            proxy_pass http://nodejs_cluster;
        }

        location = /api/v1/auth/register {
            limit_req zone=auth_register_per_ip burst=5 nodelay;
            proxy_pass http://nodejs_cluster;
        }

        location /api/ {
            limit_req zone=api_global_per_ip burst=20 nodelay;
            proxy_pass http://nodejs_cluster;
        }

        location / {
            add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
            proxy_pass http://nodejs_cluster;
        }
    }
}