version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: norbertsSpark-postgres
    restart: unless-stopped
    networks:
      - norbertsSpark-network
    ports:
      - '5432:5432'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-norbertsSpark}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:--E UTF8 --locale=en_US.UTF-8}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./apps/backend/init-scripts:/docker-entrypoint-initdb.d:ro
      - ./apps/backend/postgres-config/postgresql.conf:/etc/postgresql.conf:ro
      - postgres_wal:/var/lib/postgresql/wal_archive
    command: >
      postgres
      -c config_file=/etc/postgresql.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d norbertsSpark || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  norbertsSpark-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  postgres_wal:
    driver: local
