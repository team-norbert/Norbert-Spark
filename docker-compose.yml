services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18-trixie
    container_name: norbertsSpark-postgres
    restart: unless-stopped
    networks:
      - norbertsSpark-network
    ports:
      - '5432:5432'
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    shm_size: 256mb
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-norbertsSpark}
      POSTGRES_INITDB_ARGS: ${POSTGRES_INITDB_ARGS:--E UTF8 --locale=en_US.UTF-8}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./apps/backend/init-scripts:/docker-entrypoint-initdb.d:ro
      - ./apps/backend/postgres-config/postgresql.conf:/etc/postgresql.conf:ro
      - postgres_wal:/var/lib/postgresql/wal_archive
    command: >
      postgres
      -c config_file=/etc/postgresql.conf
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d norbertsSpark || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  app:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        APP_VERSION: 0.1.2
    image: norberts-spark-backend:0.1.2
    container_name: norbertsSpark-backend-1
    restart: unless-stopped
    networks:
      - norbertsSpark-network
    env_file:
      - ./apps/backend/.env.prod
    environment:
      APPLICATION_NAME: norbertsSpark-backend-1
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  app2:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        APP_VERSION: 0.1.2
    image: norberts-spark-backend:0.1.2
    container_name: norbertsSpark-backend-2
    restart: unless-stopped
    networks:
      - norbertsSpark-network
    env_file:
      - ./apps/backend/.env.prod
    environment:
      APPLICATION_NAME: norbertsSpark-backend-2
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3002
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  app3:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        APP_VERSION: 0.1.2
    image: norberts-spark-backend:0.1.2
    container_name: norbertsSpark-backend-3
    restart: unless-stopped
    networks:
      - norbertsSpark-network
    env_file:
      - ./apps/backend/.env.prod
    environment:
      APPLICATION_NAME: norbertsSpark-backend-3
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3003
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3001/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    container_name: norbertsSpark-nginx
    restart: unless-stopped
    networks:
      - norbertsSpark-network
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/ssl:/ssl:ro
    depends_on:
      - app
      - app2
      - app3

networks:
  norbertsSpark-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  postgres_wal:
    driver: local
