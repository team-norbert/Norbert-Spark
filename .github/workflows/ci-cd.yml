name: CI/CD Pipeline

permissions:
  contents: read

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Fetch base branch for affected detection
      run: git fetch origin main --depth=1

    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.29.3

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run format check
      run: pnpm run format:check

    - name: Run lint
      run: pnpm run lint

    - name: Run tests
      run: pnpm run test

    - name: Build project
      env:
        # Required by @t3-oss/env-nextjs validation in next.config.ts at build time.
        # These are placeholder values — the real values are injected at deploy time.
        NEXT_PUBLIC_POST_AI_CALLBACK_URL: ${{ secrets.NEXT_PUBLIC_POST_AI_CALLBACK_URL || 'http://localhost:3001/api/ai/callback' }}
        NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL || 'http://localhost:3000' }}
        NEXT_PUBLIC_BACKEND_URL: ${{ secrets.NEXT_PUBLIC_BACKEND_URL || 'http://localhost:3001' }}
        # Server-side vars also validated at build time
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'ci-build-secret-placeholder' }}
        GOOGLE_ID: ${{ secrets.GOOGLE_ID || 'ci-google-id-placeholder' }}
        GOOGLE_SECRET: ${{ secrets.GOOGLE_SECRET || 'ci-google-secret-placeholder' }}
        UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL || 'http://localhost:6379' }}
        UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN || 'ci-redis-token-placeholder' }}
        BACKEND_URL: ${{ secrets.BACKEND_URL || 'http://localhost:3001' }}
        BACKEND_AI_CALLBACK_URL: ${{ secrets.BACKEND_AI_CALLBACK_URL || 'http://localhost:3001/api/ai/callback' }}
        OAUTH_SYNC_SECRET: ${{ secrets.OAUTH_SYNC_SECRET || 'ci-oauth-sync-secret-placeholder' }}
      run: pnpm run build